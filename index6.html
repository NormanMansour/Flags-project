<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A==" crossorigin="anonymous" referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css">
    <title>Flags</title>
</head>

<body>
    <section class="mainContainer">
        <div class="BigDiv">
            <div class="bgd">
                <div class="div1">
                    <div class="red"></div>
                    <div class="white"></div>
                    <div class="blue"></div>
                </div>
            </div>
            <div class="bgd">
                <div class="div2">
                    <div class="black"></div>
                    <div class="yellow"></div>
                    <div class="red"></div>
                </div>
            </div>
            <div class="bgd">
                <div class="div3">
                    <div class="green"></div>
                    <div class="white">
                        <i class="fa-sharp fa-solid fa-star"></i>
                        <i class="fa-sharp fa-solid fa-star"></i>
                        <i class="fa-sharp fa-solid fa-star"></i>
                    </div>
                    <div class="black"></div>
                </div>
            </div>
            <div class="bgd">
                <div class="div4">
                    <div class="green"></div>
                    <div class="white"></div>
                    <div class="red"></div>
                </div>
            </div>

        </div>
    </section>
</body>

</html>
